services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alexalexdev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-vin_check}
    ports:
      - '127.0.0.1:${DB_HOST_PORT:-5432}:5432'
    volumes:
      - vin_check_db_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-alexalexdev} -d ${POSTGRES_DB:-vin_check}']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    env_file:
      - .env
    environment:
      PSQL_DB_URL: postgresql://${POSTGRES_USER:-alexalexdev}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vin_check}
    depends_on:
      db:
        condition: service_healthy
    profiles: ['tools']

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        PORT: ${PORT:-5001}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: ${PORT:-5001}
      PSQL_DB_URL: postgresql://${POSTGRES_USER:-alexalexdev}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vin_check}
    expose:
      - '${PORT:-5001}'
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
      PORT: ${PORT:-5001}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  vin_check_db_data_prod:
  caddy_data:
  caddy_config:
